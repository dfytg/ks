# cargo-deny — supply-chain gate over the entire dependency tree.
# Run locally with `cargo deny check`; enforced in CI by
# .github/workflows/security.yml (also on a weekly schedule, so newly disclosed
# advisories are caught even without a code change).

[advisories]
# A RustSec advisory or a yanked release fails the check. Add specific
# `RUSTSEC-…` IDs to `ignore` only with a written justification.
yanked = "deny"
ignore = []

[bans]
# Flag accidental duplicate versions of the same crate; forbid wildcard deps.
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive allow-list; the check fails on anything outside it (e.g. GPL).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",       # Boost — permissive (e.g. clipboard-win, error-code)
  "ISC",
  "MPL-2.0",       # file-level copyleft; safe to depend on (e.g. option-ext via directories)
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[sources]
# Every dependency must come from a known registry (crates.io); no surprise
# git or alternative-registry sources.
unknown-registry = "deny"
unknown-git = "deny"
